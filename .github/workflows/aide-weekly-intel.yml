# AIDE Weekly Intel Loop
#
# Runs every Monday 00:00 UTC (= 09:00 KST) to scan the outside world
# for signals relevant to agent-led development:
#   * Vendor releases (Anthropic, OpenAI, Google)
#   * Social discourse (HN, tech blogs, X, Threads)
#   * Benchmark leaderboards (SWE-bench, Terminal-bench, etc.)
#
# Purely read-only intel collection. No model API keys required.
#
# Two jobs:
#   1. `collect`  — Phases A–D. Pure sensor pass. Commits the raw
#      digest under `evolution/intel/` directly to the running branch.
#      When dispatch thresholds are crossed, fires a
#      repository_dispatch that wakes the monthly Evolution Engine.
#   2. `synthesize` — Phases E–G. Drafts the weekly research synthesis
#      (en + ko), optional RFC stub, and CHANGELOG entry. These are
#      *judgement* artifacts, not sensor data — they open a PR rather
#      than push to the branch so the axiom-gate runs (A1/A2/A3/A4/A5)
#      and a different-vendor reviewer can co-sign.

name: AIDE Weekly Intel

on:
  schedule:
    - cron: '0 0 * * 1'  # Every Monday 00:00 UTC (Mon 09:00 KST)
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'How many days of history to include'
        required: false
        type: string
        default: '7'
      open_synthesis_pr:
        description: 'Open a PR with weekly synthesis / RFC draft / CHANGELOG'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: aide-weekly-intel
  cancel-in-progress: false

env:
  INTEL_DIR: "evolution/intel"
  INTEL_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '7' }}
  PYTHONPATH: evolution/scripts/intel

jobs:
  collect:
    name: "Collect external signals"
    runs-on: ubuntu-latest
    outputs:
      should_dispatch: ${{ steps.digest.outputs.should_dispatch }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Phase A — Vendor releases
        run: python evolution/scripts/intel/fetch_vendor_releases.py
        continue-on-error: true

      - name: Phase B — Social signals
        run: python evolution/scripts/intel/fetch_social_signals.py
        continue-on-error: true

      - name: Phase C — Benchmark leaderboards
        run: python evolution/scripts/intel/fetch_benchmarks.py
        continue-on-error: true

      - name: Phase D — Compile digest & decide dispatch
        id: digest
        run: |
          python evolution/scripts/intel/compile_weekly_digest.py
          SHOULD=$(python -c "import json; print(json.load(open('evolution/intel/dispatch.json'))['should_dispatch'])")
          echo "should_dispatch=${SHOULD,,}" >> "$GITHUB_OUTPUT"

      - name: Upload intel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weekly-intel
          path: evolution/intel/

      - name: Commit weekly digest
        run: |
          git config user.name "AIDE Weekly Intel"
          git config user.email "aide-intel@noreply.github.com"
          git add evolution/intel/
          if git diff --cached --quiet; then
            echo "No intel changes this week."
            exit 0
          fi
          TODAY=$(date -u +"%Y-%m-%d")
          git commit -m "intel(weekly): external signal scan ${TODAY}

          Sources: Anthropic/OpenAI/Google releases, HN, tech blogs, SWE-bench.
          Dispatch: ${{ steps.digest.outputs.should_dispatch }}
          See evolution/intel/weekly-${TODAY}.md for the human-readable digest."
          git push origin HEAD:${GITHUB_REF_NAME}

  dispatch_evolution:
    name: "Wake Evolution Engine (if signal)"
    needs: collect
    if: needs.collect.outputs.should_dispatch == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download digest
        uses: actions/download-artifact@v4
        with:
          name: weekly-intel
          path: evolution/intel/

      - name: Send repository_dispatch
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const dispatch = JSON.parse(
              fs.readFileSync('evolution/intel/dispatch.json', 'utf8')
            );
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: dispatch.event_type,
              client_payload: dispatch.client_payload,
            });
            core.notice(`Dispatched ${dispatch.event_type}: ${dispatch.reasons.join(', ')}`);

  synthesize:
    name: "Synthesize research + draft RFC (PR)"
    needs: collect
    if: ${{ github.event.inputs.open_synthesis_pr != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Download digest
        uses: actions/download-artifact@v4
        with:
          name: weekly-intel
          path: evolution/intel/

      - name: Phase E — Draft weekly research synthesis (en + ko)
        run: python evolution/scripts/intel/synthesize_research.py

      - name: Phase F — Draft RFC stub (only if thresholds crossed)
        run: python evolution/scripts/intel/draft_rfc.py

      - name: Phase G — Update CHANGELOG [Unreleased]
        run: python evolution/scripts/intel/update_changelog.py

      - name: Open synthesis PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TODAY=$(date -u +"%Y-%m-%d")
          BRANCH="aide-intel/synthesis-${TODAY}"

          git config user.name "AIDE Weekly Intel"
          git config user.email "aide-intel@noreply.github.com"

          # Always start from the freshly-collected base
          git fetch origin "${GITHUB_REF_NAME}" --depth=1 || true
          git checkout -B "${BRANCH}"

          git add research/ rfcs/ CHANGELOG.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No synthesis changes this week — skipping PR."
            exit 0
          fi

          git commit -m "intel(synthesis): weekly research draft ${TODAY}

          Author: aide-weekly-intel/synthesize_research.py v1
          Author-model: claude-opus-4-7 (vendor: anthropic)
          Reviewed-by: (pending — different-vendor reviewer required per Axiom A2)
          Source: evolution/intel/weekly-${TODAY}.md

          This commit only adds drafts under research/ and (when thresholds
          fire) rfcs/. It does NOT edit principle-metadata.yaml, axioms.yaml,
          or docs/{en,ko}/AIDE-METHODOLOGY.md — those changes require
          multi-vendor consensus per Axioms A2 + A4."

          git push -u origin "${BRANCH}"

          PR_BODY=$(cat <<EOF
          ## Weekly Intel Synthesis — ${TODAY}

          Auto-generated by \`.github/workflows/aide-weekly-intel.yml\` → \`synthesize\` job.

          ### What is in this PR
          - \`research/en/${TODAY}-weekly-synthesis.md\` — English architectural-claims draft
          - \`research/ko/${TODAY}-weekly-synthesis.md\` — Korean mirror
          - \`rfcs/NNNN-weekly-intel-${TODAY}.md\` — RFC stub (only if dispatch thresholds crossed)
          - \`CHANGELOG.md\` — Unreleased entry summarizing this cycle

          ### What this PR explicitly does NOT do
          - Edit \`principle-metadata.yaml\` (requires multi-vendor consensus per A4)
          - Edit \`axioms.yaml\` (immutable by construction)
          - Edit \`docs/{en,ko}/AIDE-METHODOLOGY.md\` body (requires co-signed RFC)

          ### Reviewer checklist
          - [ ] author_model: claude-opus-4-7 (vendor: anthropic)
          - [ ] reviewer_model: _(fill — must be different vendor for A2)_
          - [ ] At least one piece of evidence independently verified
          - [ ] Claims either accepted, amended, or rejected (silent merge not accepted)
          EOF
          )

          gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "${BRANCH}" \
            --title "intel(synthesis): weekly research draft ${TODAY}" \
            --body "${PR_BODY}" \
            --draft || echo "PR may already exist; continuing."
