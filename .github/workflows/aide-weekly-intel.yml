# AIDE Weekly Intel Loop
#
# Runs every Monday 00:00 UTC (= 09:00 KST) to scan the outside world
# for signals relevant to agent-led development:
#   * Vendor releases (Anthropic, OpenAI, Google)
#   * Social discourse (HN, tech blogs, X, Threads)
#   * Benchmark leaderboards (SWE-bench, Terminal-bench, etc.)
#
# Purely read-only. No model API keys required. When thresholds are
# crossed, fires a repository_dispatch that wakes the monthly Evolution
# Engine for deliberation.

name: AIDE Weekly Intel

on:
  schedule:
    - cron: '0 0 * * 1'  # Every Monday 00:00 UTC (Mon 09:00 KST)
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'How many days of history to include'
        required: false
        type: string
        default: '7'

permissions:
  contents: write
  issues: write

concurrency:
  group: aide-weekly-intel
  cancel-in-progress: false

env:
  INTEL_DIR: "evolution/intel"
  INTEL_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '7' }}
  PYTHONPATH: evolution/scripts/intel

jobs:
  collect:
    name: "Collect external signals"
    runs-on: ubuntu-latest
    outputs:
      should_dispatch: ${{ steps.digest.outputs.should_dispatch }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Phase A — Vendor releases
        run: python evolution/scripts/intel/fetch_vendor_releases.py
        continue-on-error: true

      - name: Phase B — Social signals
        run: python evolution/scripts/intel/fetch_social_signals.py
        continue-on-error: true

      - name: Phase C — Benchmark leaderboards
        run: python evolution/scripts/intel/fetch_benchmarks.py
        continue-on-error: true

      - name: Phase D — Compile digest & decide dispatch
        id: digest
        run: |
          python evolution/scripts/intel/compile_weekly_digest.py
          SHOULD=$(python -c "import json; print(json.load(open('evolution/intel/dispatch.json'))['should_dispatch'])")
          echo "should_dispatch=${SHOULD,,}" >> "$GITHUB_OUTPUT"

      - name: Phase E — Synthesize research note (AIDE-relevance filtered)
        run: python evolution/scripts/intel/synthesize_research_note.py
        continue-on-error: true

      - name: Phase F — Conditional RFC draft
        run: python evolution/scripts/intel/draft_rfc_if_threshold.py
        continue-on-error: true

      - name: Phase G — Append entry to docs/recent-intel
        run: python evolution/scripts/intel/update_docs_recent_intel.py
        continue-on-error: true

      - name: Upload intel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weekly-intel
          path: evolution/intel/

      - name: Commit weekly digest + synthesis + RFC draft (if any)
        run: |
          git config user.name "AIDE Weekly Intel"
          git config user.email "aide-intel@noreply.github.com"
          git add evolution/intel/ research/intel/ rfcs/ docs/en/recent-intel.md docs/ko/recent-intel.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No intel changes this week."
            exit 0
          fi
          TODAY=$(date -u +"%Y-%m-%d")
          SYNTH_LINE=""
          if [ -f evolution/intel/synthesis-summary.json ]; then
            WROTE=$(python -c "import json; print(json.load(open('evolution/intel/synthesis-summary.json'))['wrote_synthesis'])")
            SYNTH_LINE="Synthesis written: ${WROTE}"
          fi
          RFC_LINE=""
          if [ -f evolution/intel/rfc-draft-report.json ]; then
            RFC_NUM=$(python -c "import json; r=json.load(open('evolution/intel/rfc-draft-report.json')); print(r.get('rfc_number') or 'none')")
            RFC_LINE="RFC draft: ${RFC_NUM}"
          fi
          git commit -m "intel(weekly): external signal scan ${TODAY}

          Sources: Anthropic/OpenAI/Google releases, HN, tech blogs, SWE-bench.
          Dispatch: ${{ steps.digest.outputs.should_dispatch }}
          ${SYNTH_LINE}
          ${RFC_LINE}
          See evolution/intel/weekly-${TODAY}.md for the raw digest and
          research/intel/${TODAY}-weekly-synthesis.md for the AIDE-filtered
          architectural reading (when present)."
          git push origin HEAD:${GITHUB_REF_NAME}

  dispatch_evolution:
    name: "Wake Evolution Engine (if signal)"
    needs: collect
    if: needs.collect.outputs.should_dispatch == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download digest
        uses: actions/download-artifact@v4
        with:
          name: weekly-intel
          path: evolution/intel/

      - name: Send repository_dispatch
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const dispatch = JSON.parse(
              fs.readFileSync('evolution/intel/dispatch.json', 'utf8')
            );
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: dispatch.event_type,
              client_payload: dispatch.client_payload,
            });
            core.notice(`Dispatched ${dispatch.event_type}: ${dispatch.reasons.join(', ')}`);
