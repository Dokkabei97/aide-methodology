reversal:
  scope: "All changes in this cycle revert atomically via git revert."
  files_touched:
    - "research/en/2026-06-08-weekly-synthesis.md"
    - "research/ko/2026-06-08-weekly-synthesis.md"
    - "rfcs/0005-durable-agent-context-as-first-class-surface.md"
    - "rfcs/README.md"
    - "evolution/history/2026-06-08-weekly-synthesis.yaml"
  files_NOT_touched:
    - "axioms.yaml"
    - "principle-metadata.yaml"
    - "docs/en/AIDE-METHODOLOGY.md"
    - "docs/ko/AIDE-METHODOLOGY.md"
  rollback_command: "git revert <merge_commit_sha>"
  rollback_smoke_test: |
    After revert, confirm:
      test ! -f research/en/2026-06-08-weekly-synthesis.md
      test ! -f research/ko/2026-06-08-weekly-synthesis.md
      test ! -f rfcs/0005-durable-agent-context-as-first-class-surface.md
      test ! -f evolution/history/2026-06-08-weekly-synthesis.yaml
      grep -q '0004' rfcs/README.md
      ! grep -q '0005' rfcs/README.md

