    principle_axiom_hit: ["P8", "P9"]
    persistence: 3_weeks
    vendor_corroboration: 2
    decision: defers_to_next_charter
    rationale: |
      P8 and P9 are permanent principles. Structural refinement of their
      v2_adaptations is justified by the signal but is too large a surface
      change for a single curator pass. Logged as the leading deliberation
      surface for the next monthly Evolution Engine charter.
