# AIDE Evolution History — 2026-06-08 Weekly Synthesis
#
# Second entry in evolution/history/. Records the back-catalog window
# 2026-05-05 → 2026-06-08 (4 unattended weekly digests + 2026-06-08).
# Per Axiom A1 (Reversibility), every change below names the exact
# git revert that undoes it; per A3 (Empiricism), every change carries
# quantitative evidence (cross-week persistence count); per A4 (No
# Single Authority), every change is marked single_agent_draft until a
# different-vendor reviewer countersigns.

schema_version: "1.0"
entry_kind: weekly_synthesis
entry_date: "2026-06-08"
lookback_window: "2026-05-05..2026-06-08"
back_catalog_note: |
  No curator session opened between 2026-05-04 (the previous synthesis) and
  this entry. The four intervening weekly digests (2026-05-11, 2026-05-18,
  2026-05-25, 2026-06-01) each fired Evolution Engine dispatch but had no
  consumer. This entry treats them as one continuous signal stream.

source_artifacts:
  weekly_intel_digests:
    - "evolution/intel/weekly-2026-05-11.md"
    - "evolution/intel/weekly-2026-05-18.md"
    - "evolution/intel/weekly-2026-05-25.md"
    - "evolution/intel/weekly-2026-06-01.md"
    - "evolution/intel/weekly-2026-06-08.md"  # canonical run by production GitHub Actions
  preceding_synthesis: "research/en/2026-05-04-weekly-synthesis.md"
  governing_rfc: "rfcs/0003-distributed-agent-native-scheduling.md"
  benchmark_history: "evolution/intel/benchmark-history.yaml"

participating_agent:
  role: author
  vendor: anthropic
  product: "Claude Code on web"
  model: claude-opus-4-7
  session_kind: scheduled_weekly_curator
  authority_scope: |
    Per RFC-0003 §4 (per-platform scheduling contract), this agent may open a
    draft PR carrying a research synthesis, an RFC draft, and an audit entry.
    It MAY NOT mark the PR ready-for-review, and MAY NOT modify axioms.yaml
    or principle-metadata.yaml numeric current_values without a different-
    vendor reviewer's countersignature per Axioms A2 and A4.

required_reviewer:
  policy: "A2 + A4 — at least one reviewer from a different vendor before merge."
  preferred_vendors: ["openai", "google"]
  preferred_products:
    - "Codex (OpenAI scheduled session)"
    - "Gemini CLI subagent (when scheduler ships, per RFC-0003 §3)"
  fallback: |
    If no different-vendor scheduled agent has reviewed within 7 days, the PR
    remains draft. RFC-0003 §3 forbids resolving the gap with a human bridge.

# ────────────────────────────────────────────────────────────────────────────
# Signal scoring — every persistent signal across the 4 unattended digests +
# 2026-06-08 scored against AIDE's 10 principles + 5 axioms. Survival rule:
# a signal becomes a structural-surface change only if it persists in 3+
# weekly digests OR is corroborated by 2+ vendors.
# ────────────────────────────────────────────────────────────────────────────
signals_considered:
  - id: S1
    title: "Durable agent context — pause/resume + long-running webhooks"
    raw_evidence:
      - url: "https://developers.googleblog.com/build-long-running-ai-agents-that-pause-resume-and-never-lose-context-with-adk/"
        appearances: ["weekly-2026-05-18.md", "weekly-2026-05-25.md", "weekly-2026-06-01.md"]
      - url: "https://blog.google/innovation-and-ai/technology/developers-tools/event-driven-webhooks/"
        appearances: ["weekly-2026-05-11.md"]
      - description: "OpenAI enterprise Codex case studies describing multi-session workflows"
        appearances: ["weekly-2026-05-11.md", "weekly-2026-05-18.md", "weekly-2026-05-25.md", "weekly-2026-06-01.md"]
        count: 14
    principle_axiom_hit: ["P3", "P10", "A1"]
    persistence: 4_weeks
    vendor_corroboration: 2  # Google explicit + OpenAI implicit through deployment surface
    decision: triggers_structural_surface_change
    structural_change:
      file: "principle-metadata.yaml"
      principle_options: ["P10 (preferred, lighter-touch)", "P3 v2_adaptations (alternative)"]
      changes_proposed:
        - "P10 new validity_condition VC1 (vendors_with_first_class_pause_resume <= 1; status=false)"
        - "P10 new invalidation_trigger T1 (>= 2 vendors → widen meta-code surface to runtime_state schema; severity=major)"
        - "OR: P3 new v2_adaptations block (structural_shell + durability_invariant)"
      vehicle: "rfcs/0005-durable-agent-context-as-first-class-surface.md (Draft; awaits different-vendor review)"
    quantitative_evidence:
      cross_week_persistence_count: 4
      distinct_vendor_count: 2
      enterprise_case_study_count: 14

  - id: S2
    title: "Middleware / interception as P8 + P9 structural locus"
    raw_evidence:
      - url: "https://developers.googleblog.com/announcing-genkit-middleware-intercept-extend-and-harden-your-agentic-apps/"
        appearances: ["weekly-2026-05-18.md", "weekly-2026-05-25.md", "weekly-2026-06-01.md"]
